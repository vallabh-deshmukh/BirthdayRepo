<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Card</title>
    <meta
      name="description"
      content="Create an interactive birthday card with a cake, candles to blow out, and a hidden message."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Nunito:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-deco" aria-hidden="true">
      <span class="float float-balloon">🎈</span>
      <span class="float float-gift">🎁</span>
      <span class="float float-cake">🎂</span>
      <span class="float float-party">🎉</span>
    </div>

    <main id="app"></main>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <script src="./app.js"></script>
  </body>
</html>
